# Production build on PRs to main and the MVP foundation branch.
# Datadog synthetics: configure DD_API_KEY + DD_APP_KEY repo secrets to re-enable.

name: CI

on:
  push:
    branches: [main, cursor/mvp-app-foundation]
  pull_request:
    branches: [main, cursor/mvp-app-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
