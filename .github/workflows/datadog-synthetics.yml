# Datadog Synthetic tests (optional) + Next.js production build

name: CI

on:
  push:
    branches: [main, cursor/mvp-app-foundation]
  pull_request:
    branches: [main, cursor/mvp-app-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Run Datadog Synthetic tests
        if: ${{ secrets.DD_API_KEY != '' && secrets.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: tag:e2e-tests
